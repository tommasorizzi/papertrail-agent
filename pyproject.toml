[project]
name = "papertrail-agent"
version = "0.1.0"
description = "Local evidence retrieval for technical documents."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1,<2",
    "openai>=2,<3",
    "pydantic>=2,<3",
    "scikit-learn>=1.4",
    "streamlit>=1.48,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
